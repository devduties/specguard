[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard"
version = "0.1.0"
description = "Validate API requests against OpenAPI contracts before forwarding them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Taiwo Oyebode" }]
dependencies = [
  "httpx>=0.28,<0.29",
  "openapi-schema-validator>=0.9,<0.10",
  "openapi-spec-validator>=0.9,<1",
  "PyYAML>=6,<7",
  "referencing>=0.37,<0.38",
  "starlette>=0.48,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
specguard = "specguard.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
